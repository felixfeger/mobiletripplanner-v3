<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Plan a trip — City Metro</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="page-plan">
  <main class="planner">
    <div class="planner-map canvas-wrap" id="planMapWrap"><canvas id="planCanvas" aria-label="Route map"></canvas></div>

    <section class="planner-panel">
      <div class="od-card">
        <button class="od-field" id="fromBtn"><span class="od-dot from"></span><span class="od-text placeholder" id="fromText">Choose starting station</span></button>
        <button class="od-swap" id="swapBtn" aria-label="Swap start and destination">⇅</button>
        <button class="od-field" id="toBtn"><span class="od-dot to"></span><span class="od-text placeholder" id="toText">Choose destination</span></button>
      </div>
      <div id="modeTabs"></div>
      <div id="results"><p class="hint">Pick a start and a destination to compare routes.</p></div>
    </section>
  </main>

  <div class="overlay picker" id="picker" hidden>
    <div class="dialog dialog-tall" role="dialog" aria-modal="true" aria-label="Choose a station">
      <div class="picker-head">
        <input id="pickerInput" type="search" placeholder="Search stations, streets or lines" autocomplete="off">
        <button class="btn btn-ghost" id="pickerClose">Cancel</button>
      </div>
      <div class="picker-list" id="pickerList"></div>
    </div>
  </div>

  <script type="module" src="js/planner-page.js"></script>
</body>
</html>
