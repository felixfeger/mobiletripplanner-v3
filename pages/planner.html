<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Plan a trip — City Metro</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app plan" id="app" data-view="search">
    <aside class="side" id="side" data-state="peek" aria-label="Trip planner">
      <button class="side-handle" id="sideHandle" aria-label="Expand or collapse panel"><span></span></button>
      <div class="plan-head" id="planHead">
        <div class="head-bar"><button class="icon-btn" id="backBtn" aria-label="Back"></button><div class="head-title" id="headTitle"></div></div>
        <div class="od" id="od">
          <div class="od-rail" aria-hidden="true"><i class="dot"></i><i class="dot to"></i></div>
          <div class="od-fields">
            <input id="fromInput" placeholder="Starting station" autocomplete="off" aria-label="Starting station">
            <input id="toInput" placeholder="Destination" autocomplete="off" aria-label="Destination">
          </div>
          <button class="od-swap" id="swapBtn" aria-label="Swap start and destination"></button>
        </div>
        <div id="modeTabs"></div>
        <div class="pills" id="pills">
          <span class="pill">Leave now</span>
          <button class="round-btn" id="refreshBtn" aria-label="Refresh times"></button>
          <button class="round-btn red" id="clearBtn" aria-label="Clear trip"></button>
        </div>
      </div>
      <div class="side-scroll" id="planBody"></div>
      <div class="side-foot" id="planFoot"></div>
    </aside>

    <section class="map-area">
      <div class="canvas-wrap" id="planMapWrap"><canvas id="planCanvas" aria-label="Route map"></canvas></div>
      <div class="arrive-float" id="arriveFloat" hidden></div>
      <div class="map-ctrls" aria-label="Map controls">
        <button id="zoomIn" aria-label="Zoom in">+</button>
        <button id="zoomOut" aria-label="Zoom out">−</button>
        <button id="zoomFit" aria-label="Fit route">⤢</button>
      </div>
    </section>
  </main>
  <script type="module" src="js/planner-page.js"></script>
</body>
</html>
