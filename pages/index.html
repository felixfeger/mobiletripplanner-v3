<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>City Metro Transit</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app" id="app">
    <aside class="side" id="side" data-state="peek" aria-label="Nearby services">
      <button class="side-handle" id="sideHandle" aria-label="Expand or collapse panel"><span></span></button>
      <div class="side-scroll" id="sideBody"><div class="empty"><div class="spinner"></div>Loading network…</div></div>
    </aside>

    <section class="map-area">
      <div class="canvas-wrap" id="mapWrap"><canvas id="mapCanvas" aria-label="Transit map"></canvas></div>
      <a class="search-pill" href="planner.html" id="searchPill"><span id="searchIc"></span><span>Where to?</span></a>
      <div class="map-ctrls" aria-label="Map controls">
        <button id="zoomIn" aria-label="Zoom in">+</button>
        <button id="zoomOut" aria-label="Zoom out">−</button>
        <button id="zoomFit" aria-label="Show whole network">⤢</button>
      </div>
      <div class="popup" id="popup" hidden role="dialog" aria-label="Station"></div>
    </section>
  </main>
  <script type="module" src="js/map-page.js"></script>
</body>
</html>
