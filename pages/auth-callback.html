<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Signing in — City Metro</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="cb">
    <img class="cb-logo" src="img/logo.png" alt="City Metro">
    <div class="spinner" id="cbSpin" aria-hidden="true"></div>
    <h1 id="cbTitle">Signing you in…</h1>
    <p class="muted" id="cbMsg" role="status"></p>
    <div class="cb-actions" id="cbActions" hidden>
      <button class="btn btn-primary" id="cbRetry">Try again</button>
      <a class="btn btn-ghost" href="index.html">Back to the map</a>
    </div>
  </main>
  <script type="module" src="js/auth-callback.js"></script>
</body>
</html>
